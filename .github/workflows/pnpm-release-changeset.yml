name: pnpm-release-changeset
on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
  workflow_call:
    inputs:
      pnpm-version:
        type: string
        required: false
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

# `id-token: write` mints the OIDC token npm exchanges for a short-lived
# publish credential. This is what replaces the long-lived NPM_TOKEN, and it
# is also what makes npm attach provenance to each published tarball.
permissions:
  id-token: write
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # Trusted publishing requires npm 11.5.1+. Node LTS may ship an older npm.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Install Dependencies
        run: pnpm install
      - run: pnpm build

      # changesets/action v2 only runs against @changesets/cli v3 (it refuses v2), so
      # every caller needs cli v3.
      #
      # v2 renamed the inputs (version -> version-script, publish -> publish-script,
      # commit -> commit-message) and dropped the GITHUB_TOKEN *env var* in favour of the
      # github-token *input*. The old names are ignored with a warning, then the action
      # fails with "The following inputs have been renamed".
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          commit-message: 'chore: version packages'
          version-script: pnpm run version
          publish-script: pnpm run release
          github-token: ${{ secrets.CI_GITHUB_TOKEN }}
